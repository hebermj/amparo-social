# Configuração da Instância SearXNG Própria do Amparo (contêiner dedicado).
# Herda os defaults oficiais e ajusta idioma/JSON/segurança.
# Secrets são injetados pelo compose via SEARXNG_SECRET.

use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json
  default_lang: "pt-BR"
  languages:
    - "pt-BR"
  safe_search: 1

ui:
  default_locale: "pt-BR"
  theme: "simple"
